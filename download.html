const LANGS = Object.keys(I18N);
const names = {en:"English",ru:"Русский",es:"Español",pt:"Português",fr:"Français",de:"Deutsch",tr:"Türkçe",ar:"العربية",zh:"中文",hi:"हिन्दी",id:"Indonesia",vi:"Tiếng Việt",fa:"فارسی"};
function pick(l) {
  const d = I18N[l];
  document.querySelector('[data-i18n="tagline"]').textContent = d.tagline;
  document.querySelector('[data-i18n="download"]').textContent = d.download;
  document.querySelector('[data-i18n="installTitle"]').textContent = d.installTitle;
  const ol = document.querySelector('[data-i18n="steps"]');
  ol.innerHTML = d.steps.map(s => "<li>" + s + "</li>").join("");
  document.querySelector('[data-i18n="warn"]').innerHTML = d.warn;
  document.querySelector('[data-i18n="troubleTitle"]').textContent = d.troubleTitle;
  document.querySelector('[data-i18n="trouble"]').innerHTML = d.trouble;
  document.documentElement.lang = l;
  document.documentElement.dir = (l === "ar" || l === "fa") ? "rtl" : "ltr";
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  try { localStorage.setItem("jv_lang", l); } catch (e) {}
}
const bar = document.getElementById("langs");
LANGS.forEach(l => {
  const b = document.createElement("button");
  b.textContent = names[l];
  b.dataset.l = l;
  b.onclick = () => pick(l);
  bar.appendChild(b);
});
let saved = "en";
try { saved = localStorage.getItem("jv_lang") || (navigator.language || "en").slice(0,2); } catch (e) {
  saved = (navigator.language || "en").slice(0,2);
}
pick(I18N[saved] ? saved : "en");
</script>
